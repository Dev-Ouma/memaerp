# Module boundary enforcement for the modular monolith.
#
# The whole bet of this architecture is that sixteen bounded contexts can share one deployable
# without becoming one tangle. Nothing enforces that but this file: without it, "modular monolith"
# degrades into "monolith with folders" in about a quarter's worth of deadlines.
#
# The rules, in plain language:
#
#   * Platform knows nothing about any module except its published Contracts. Platform is the
#     bottom of the stack; if it grows a dependency on a module, that module can never be
#     extracted and Platform can never be reused.
#   * SharedKernel is the organisational spine (institution, campus, faculty, department, calendar,
#     grading) plus the canonical person record. Every context legitimately shares these; they are
#     the vocabulary the university itself uses. It depends on Platform and Contracts only.
#   * Contracts are each module's published API. Any module may depend on any module's Contracts.
#     Contracts themselves may only reach Platform — a contract that drags in an implementation is
#     not a contract.
#   * A module may depend on Platform, SharedKernel, Contracts and Iam. Reaching into another
#     module's Models, Services or Http is a violation.
#
# Iam is on that allow-list deliberately and not permanently. Authentication and authorisation are
# genuinely cross-cutting — nearly every table records who created, approved or revoked a row — but
# the target is for those call sites to type against Iam\Contracts\Actor rather than the concrete
# User model. Tightening this line is a real piece of work with a real payoff, not an oversight.
#
# Existing violations live in deptrac-baseline.yaml, generated rather than hand-maintained:
#
#     ./vendor/bin/deptrac analyse --formatter=baseline --output=deptrac-baseline.yaml
#
# That file is a debt ledger. It should only ever shrink. Regenerating it to silence a NEW
# violation defeats the point of having it.

imports:
  - deptrac-baseline.yaml

deptrac:
  paths:
    - ./app

  exclude_files:
    - '#app/Modules/[A-Za-z]+/Tests/.*#'

  layers:
    - name: Platform
      collectors:
        - type: classLike
          value: ^App\\Platform\\.*
        - type: classLike
          value: ^App\\Http\\Controllers\\Controller$

    # The organisational spine and the canonical person. Shared on purpose, by every context.
    - name: SharedKernel
      collectors:
        - type: classLike
          value: ^App\\Modules\\Institution\\Models\\.*
        - type: classLike
          value: ^App\\Modules\\Student\\Models\\Person$
        - type: classLike
          value: ^App\\Modules\\Student\\Models\\PersonIdentity$

    # Every module's published API, collected into one layer so the ruleset stays one line each.
    - name: Contracts
      collectors:
        - type: classLike
          value: ^App\\Modules\\[A-Za-z]+\\Contracts\\.*

    - name: Admission
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Admission\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Admission\\Contracts\\.*

    - name: Analytics
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Analytics\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Analytics\\Contracts\\.*

    - name: Audit
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Audit\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Audit\\Contracts\\.*

    - name: Cms
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Cms\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Cms\\Contracts\\.*

    - name: Course
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Course\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Course\\Contracts\\.*

    - name: Curriculum
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Curriculum\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Curriculum\\Contracts\\.*

    - name: Enrollment
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Enrollment\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Enrollment\\Contracts\\.*

    - name: Examination
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Examination\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Examination\\Contracts\\.*

    - name: Finance
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Finance\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Finance\\Contracts\\.*

    - name: Graduation
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Graduation\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Graduation\\Contracts\\.*

    - name: Hr
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Hr\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Hr\\Contracts\\.*

    - name: Iam
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Iam\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Iam\\Contracts\\.*

    - name: Institution
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Institution\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Institution\\Contracts\\.*
            - type: classLike
              value: ^App\\Modules\\Institution\\Models\\.*

    - name: Procurement
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Procurement\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Procurement\\Contracts\\.*

    - name: Research
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Research\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Research\\Contracts\\.*

    - name: Student
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^App\\Modules\\Student\\.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Student\\Contracts\\.*
            - type: classLike
              value: ^App\\Modules\\Student\\Models\\Person$
            - type: classLike
              value: ^App\\Modules\\Student\\Models\\PersonIdentity$

    # Framework wiring: bootstrap providers, the base controller. Allowed to see everything,
    # because somebody has to bind the concrete implementations to the contracts.
    - name: Application
      collectors:
        - type: classLike
          value: ^App\\(Models|Providers)\\.*

  ruleset:
    Platform:
      - Contracts

    SharedKernel:
      - Platform
      - Contracts

    Contracts:
      - Platform

    # Iam sits below the other modules: it may not depend on them.
    Iam:
      - Platform
      - SharedKernel
      - Contracts

    Admission:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Analytics:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Audit:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Cms:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Course:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Curriculum:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Enrollment:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Examination:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Finance:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Graduation:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Hr:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Institution:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Procurement:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Research:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Student:
      - Platform
      - SharedKernel
      - Contracts
      - Iam

    Application:
      - Platform
      - SharedKernel
      - Contracts
      - Admission
      - Analytics
      - Audit
      - Cms
      - Course
      - Curriculum
      - Enrollment
      - Examination
      - Finance
      - Graduation
      - Hr
      - Iam
      - Institution
      - Procurement
      - Research
      - Student
