      summary: Add a catalogue-level course requirement
      tags: [Courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [required_course_id, requirement_type]
              properties:
                required_course_id: { type: string, format: uuid }
                requirement_type: { type: string, enum: [PREREQUISITE, COREQUISITE, ANTIREQUISITE] }
