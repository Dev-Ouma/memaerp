        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: mema-university-erp-session
  schemas:
    AwardLevel:
      type: string
      enum: [CERTIFICATE, DIPLOMA, BACHELORS, MASTERS, DOCTORATE]
    CurriculumVersionStatus:
      type: string
      enum: [DRAFT, UNDER_REVIEW, APPROVED, SUPERSEDED]
    Programme:
      type: object
      required: [id, institution_id, department_id, code, name, award_level, duration_years, total_credits_required, is_active]
      properties:
        id: { type: string, format: uuid }
        institution_id: { type: string, format: uuid }
        department_id: { type: string, format: uuid }
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 200 }
        award_level: { $ref: '#/components/schemas/AwardLevel' }
        duration_years: { type: integer, minimum: 1, maximum: 10 }
        total_credits_required: { type: integer, minimum: 1, maximum: 1000 }
        minimum_residency_credits: { type: integer, minimum: 0, maximum: 1000 }
        qualification_framework_code: { type: [string, 'null'], maxLength: 50 }
        accreditation_body: { type: [string, 'null'], maxLength: 100 }
        accreditation_reference: { type: [string, 'null'], maxLength: 100 }
        accreditation_expires_on: { type: [string, 'null'], format: date }
        accreditation_warning: { type: boolean }
        is_active: { type: boolean }
        department: { type: [object, 'null'], additionalProperties: true }
        versions:
          type: array
          items: { $ref: '#/components/schemas/CurriculumVersion' }
    CreateProgramme:
      type: object
      additionalProperties: false
      required: [department_id, code, name, award_level, duration_years, total_credits_required]
      properties:
