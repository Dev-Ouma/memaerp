openapi: 3.1.0
info:
  title: Mema University ERP API
  version: 0.5.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    Governance scaffold. Operation paths are generated from the Laravel implementation;
    undocumented handwritten production endpoints are prohibited.
servers:
  - url: /api/v1
    description: Same-origin API
security:
  - sanctumCookie: []
paths:
  /students:
    get:
      operationId: listStudents
      summary: List student records visible to the caller
      description: >-
        Returns only records within the caller's institution and organizational scope.
        Filters are allow-listed and applied after authorization scope at query level.
      tags: [Students]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - student_number
              - -student_number
              - matriculated_on
              - -matriculated_on
              - created_at
              - -created_at
            default: student_number
        - name: filter[status]
          in: query
          schema: { $ref: '#/components/schemas/StudentStatus' }
        - name: filter[academic_standing]
          in: query
          schema: { $ref: '#/components/schemas/AcademicStanding' }
        - name: filter[programme_id]
          in: query
          schema: { type: string, format: uuid }
        - name: filter[campus_id]
          in: query
          schema: { type: string, format: uuid }
        - name: filter[department_id]
          in: query
          schema: { type: string, format: uuid }
        - name: filter[search]
          in: query
          description: Case-insensitive student number, name, or primary email search.
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '200':
          description: Scoped cursor page of students.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /students/{student}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      operationId: getStudent
      summary: Get one visible student record
      tags: [Students]
      responses:
        '200':
          description: Student record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: updateStudent
      summary: Update controlled student lifecycle fields
      description: >-
        Requires student.record.update over the record's scope. Identity, student number,
        programme, organizational attribution, admission year, and matriculation date cannot be
        changed through this generic endpoint. Direct creation and deletion are intentionally
        absent; matriculation and record retention use governed workflows.
      tags: [Students]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStudent' }
            example:
              status: ON_LEAVE
              change_reason: Approved leave of absence for the current term.
      responses:
        '200':
          description: Updated student record and audit correlation metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /institution/overview:
    get:
      operationId: getInstitutionOverview
      summary: Get institutional hierarchy and current-calendar totals
      tags: [Institution]
      responses:
        '200':
          description: Institutional overview.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/InstitutionOverview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /institution/campuses:
    get:
      operationId: listCampuses
      summary: Search and paginate campuses
      tags: [Institution]
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/InstitutionCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCampus
      summary: Create a governed campus record
      tags: [Institution]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCampus' }
      responses:
        '201':
          description: Campus created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionRecordResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/faculties:
    get:
      operationId: listFaculties
      summary: List faculties and schools with their campus
      tags: [Institution]
      responses:
        '200': { $ref: '#/components/responses/InstitutionCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createFaculty
      summary: Create a governed faculty or school
      tags: [Institution]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFaculty' }
      responses:
        '201': { $ref: '#/components/responses/InstitutionCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/departments:
    get:
      operationId: listDepartments
      summary: Search departments with faculty and campus context
      tags: [Institution]
      responses:
        '200': { $ref: '#/components/responses/InstitutionCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createDepartment
      summary: Create a governed department
      tags: [Institution]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDepartment' }
      responses:
        '201': { $ref: '#/components/responses/InstitutionCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/campuses/{campus}:
    patch:
      operationId: updateCampus
      summary: Update, approve, or archive a campus without deleting history
      tags: [Institution]
      parameters: [{ $ref: '#/components/parameters/CampusId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GovernedInstitutionUpdate' }
      responses:
        '200': { $ref: '#/components/responses/InstitutionRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/faculties/{faculty}:
    patch:
      operationId: updateFaculty
      summary: Update, approve, or archive a faculty, school, or centre
      tags: [Institution]
      parameters: [{ $ref: '#/components/parameters/FacultyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GovernedInstitutionUpdate' }
      responses:
        '200': { $ref: '#/components/responses/InstitutionRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/departments/{department}:
    patch:
      operationId: updateDepartment
      summary: Update, approve, or archive a department
      tags: [Institution]
      parameters: [{ $ref: '#/components/parameters/DepartmentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GovernedInstitutionUpdate' }
      responses:
        '200': { $ref: '#/components/responses/InstitutionRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/units:
    get:
      operationId: listInstitutionUnits
      summary: List the final department-to-unit hierarchy level
      tags: [Institution]
      responses:
        '200': { $ref: '#/components/responses/InstitutionCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createInstitutionUnit
      summary: Create a governed unit, centre, institute, or laboratory
      tags: [Institution]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInstitutionUnit' }
      responses:
        '201': { $ref: '#/components/responses/InstitutionCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/units/{unit}:
    patch:
      operationId: updateInstitutionUnit
      summary: Update, approve, or archive an organizational unit
      tags: [Institution]
      parameters: [{ $ref: '#/components/parameters/UnitId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GovernedInstitutionUpdate' }
      responses:
        '200': { $ref: '#/components/responses/InstitutionRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/schools:
    get:
      operationId: listSchools
      summary: Compatibility view of faculties and schools
      tags: [Institution]
      responses:
        '200': { $ref: '#/components/responses/InstitutionCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /institution/academic-years:
    get:
      operationId: listAcademicYears
      summary: List academic years and terms
      tags: [Institution Calendar]
      responses:
        '200': { $ref: '#/components/responses/InstitutionCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAcademicYear
      summary: Create a draft academic year
      tags: [Institution Calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAcademicYear' }
      responses:
        '201': { $ref: '#/components/responses/InstitutionCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/academic-years/current:
    get:
      operationId: getCurrentAcademicYear
      summary: Get the single active academic year and its terms
      tags: [Institution Calendar]
      responses:
        '200':
          description: Current academic year.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AcademicYear' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /institution/academic-years/{academicYear}/activate:
    post:
      operationId: activateAcademicYear
      summary: Senate-approve, publish and make an academic year current
      tags: [Institution Calendar]
      parameters:
        - name: academicYear
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senate_resolution_reference]
              properties:
                senate_resolution_reference: { type: string, minLength: 5, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/InstitutionRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/terms:
    post:
      operationId: createAcademicTerm
      summary: Configure a draft study-mode term and its date gates
      tags: [Institution Calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTerm' }
      responses:
        '201': { $ref: '#/components/responses/InstitutionCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/terms/{term}/activate:
    post:
      operationId: activateAcademicTerm
      summary: Publish a non-overlapping current term for its study mode
      tags: [Institution Calendar]
      parameters:
        - name: term
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/InstitutionRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/study-modes:
    get:
      operationId: listStudyModes
      summary: List configurable study modes
      tags: [Institution Calendar]
      responses:
        '200': { $ref: '#/components/responses/InstitutionCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createStudyMode
      summary: Create a study mode used by calendar rules
      tags: [Institution Calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStudyMode' }
      responses:
        '201': { $ref: '#/components/responses/InstitutionCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/study-modes/{studyMode}:
    patch:
      operationId: updateStudyMode
      summary: Update or deactivate a study mode
      tags: [Institution Calendar]
      parameters: [{ $ref: '#/components/parameters/StudyModeId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: [string, 'null'], maxLength: 255 }
                is_active: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/InstitutionRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/intakes:
    get:
      operationId: listIntakes
      summary: List admissions intake windows
      tags: [Institution Calendar]
      responses:
        '200': { $ref: '#/components/responses/InstitutionCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createIntake
      summary: Configure an admissions intake window
      tags: [Institution Calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIntake' }
      responses:
        '201': { $ref: '#/components/responses/InstitutionCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/intakes/{intake}:
    patch:
      operationId: updateIntake
      summary: Update or archive an intake window
      tags: [Institution Calendar]
      parameters: [{ $ref: '#/components/parameters/IntakeId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIntake' }
      responses:
        '200': { $ref: '#/components/responses/InstitutionRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/calendar-events:
    get:
      operationId: listCalendarEvents
      summary: List institutional holidays, deadlines, and calendar events
      tags: [Institution Calendar]
      parameters:
        - name: academic_year_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/InstitutionCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCalendarEvent
      summary: Publish a holiday, critical deadline, or academic event
      tags: [Institution Calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCalendarEvent' }
      responses:
        '201': { $ref: '#/components/responses/InstitutionCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/lookups/{type}:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, maxLength: 48 }
    get:
      operationId: listMasterLookups
      summary: Read Redis-cached active values for a lookup type
      tags: [Institution Master Data]
      responses:
        '200':
          description: Lookup values and retrieval timing.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MasterLookup' }
                  meta:
                    type: object
                    properties:
                      elapsed_ms: { type: number }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createMasterLookup
      summary: Create a lookup value and invalidate its cache
      tags: [Institution Master Data]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMasterLookup' }
      responses:
        '201': { $ref: '#/components/responses/InstitutionCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/lookups/{type}/{lookup}:
    patch:
      operationId: updateMasterLookup
      summary: Update or archive a lookup value and invalidate Redis cache
      tags: [Institution Master Data]
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, maxLength: 48 }
        - $ref: '#/components/parameters/LookupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMasterLookup' }
      responses:
        '200': { $ref: '#/components/responses/InstitutionRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/reports/directory:
    get:
      operationId: exportInstitutionDirectory
      summary: Export the organizational master directory
      tags: [Institution Reports]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [pdf, csv, json], default: pdf }
      responses:
        '200':
          description: PDF, CSV, or JSON directory export.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string } }
            application/json: { schema: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /institution/reports/calendar:
    get:
      operationId: exportAcademicCalendar
      summary: Download the official academic calendar booklet
      tags: [Institution Reports]
      parameters:
        - name: academic_year_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: University academic calendar PDF.
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /curriculum/programmes:
    get:
      operationId: listProgrammes
      summary: List institution programmes and version coverage
      tags: [Curriculum]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: award_level, in: query, schema: { $ref: '#/components/schemas/AwardLevel' } }
        - { name: department_id, in: query, schema: { type: string, format: uuid } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/ProgrammeCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createProgramme
      summary: Create a governed programme registry record
      tags: [Curriculum]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateProgramme' } }
      responses:
        '201': { $ref: '#/components/responses/ProgrammeRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /curriculum/programmes/{programme}:
    parameters:
      - $ref: '#/components/parameters/ProgrammeId'
    get:
      operationId: getProgrammeCurriculumTree
      summary: Get a programme with every curriculum version
      tags: [Curriculum]
      responses:
        '200': { $ref: '#/components/responses/ProgrammeRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateProgramme
      summary: Update controlled programme metadata
      tags: [Curriculum]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UpdateProgramme' } }
      responses:
        '200': { $ref: '#/components/responses/ProgrammeRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
