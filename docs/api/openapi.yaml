openapi: 3.1.0
info:
  title: Mema University ERP API
  version: 0.1.0
  description: >-
    Governance scaffold. Operation paths are generated from the Laravel implementation;
    undocumented handwritten production endpoints are prohibited.
servers:
  - url: /api/v1
    description: Same-origin API
security:
  - sanctumCookie: []
paths: {}
components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: __Host-mema_session
  schemas:
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [request_id, timestamp]
      properties:
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required: [code, message, trace_id]
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        trace_id:
          type: string
