name: CI / Automated Push Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mema_erp_testing
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, bcmath, zip, gd
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Composer Dependencies
      run: |
        cd laravel_erp
        composer install --prefer-dist --no-progress --no-interaction

    - name: Install NPM Dependencies & Build Assets
      run: |
        cd laravel_erp
        npm ci || npm install
        npm run build

    - name: Setup Environment & Run Tests
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: mema_erp_testing
        DB_USERNAME: runner
        DB_PASSWORD: secretpassword
      run: |
        cd laravel_erp
        cp .env.example .env || true
        php artisan key:generate --env=testing
        php artisan migrate:fresh --seed --env=testing
        php artisan test
